<svg width="960" height="330" viewBox="0 0 960 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Handwritten mathematics to structured output</title>
  <desc>A handwritten polynomial is encoded into visual features, modeled as a structured token sequence, and returned as machine-readable output.</desc>
