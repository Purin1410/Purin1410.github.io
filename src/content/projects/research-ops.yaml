title: Research Ops
tagline:
  en: A local workspace for traceable research
  vi: Workspace cục bộ cho quy trình nghiên cứu có thể truy vết
role:
  en: Developer · Personal project
  vi: Người phát triển · Dự án cá nhân
period: 2026 – present
status:
  en: Pre-alpha · In development
  vi: Pre-alpha · Đang phát triển
summary:
  en: >-
    A pre-alpha system for reducing the attention needed to keep long-running research moving without giving up provenance
    or human judgment. It keeps sources, evidence, checkpoints and decisions connected while agents handle bounded execution.
  vi: >-
    Hệ thống pre-alpha giúp giảm lượng chú ý cần thiết để duy trì nghiên cứu dài hạn mà không đánh đổi khả năng truy vết hay
    quyền phán đoán của con người. Nguồn, bằng chứng, checkpoint và quyết định được nối liền; agent chỉ thực hiện các tác vụ có giới hạn.
highlights:
  en:
    - Research sessions can resume from the exact sources, evidence and revision that produced a decision.
    - PDF metadata, source files and cited spans stay linked through content digests.
    - A human must approve runtime changes; model execution and GPU evaluation are still unfinished.
  vi:
    - Phiên nghiên cứu có thể tiếp tục từ đúng nguồn, bằng chứng và revision đã dẫn tới một quyết định.
    - Metadata PDF, file nguồn và đoạn trích dẫn được nối với nhau bằng digest nội dung.
    - Mọi thay đổi runtime cần người dùng phê duyệt; thực thi mô hình và đánh giá GPU vẫn chưa hoàn thiện.
