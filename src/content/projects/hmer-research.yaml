summary:
  en:
    Research on converting handwritten mathematical expressions into structured sequences, including experiments in
    masked-language pretraining, multi-task learning and vision-language models.
  vi:
    Nghiên cứu chuyển ảnh công thức toán viết tay thành chuỗi có cấu trúc, gồm các thí nghiệm về tiền huấn luyện ngôn ngữ
    có che, học đa nhiệm và mô hình thị giác-ngôn ngữ.
highlights:
  en:
    - Contributed to masked-language pretraining and multi-task learning experiments for HMER.
    - Explored vision-language modeling with Qwen2.5-VL and parameter-efficient adaptation via LoRA/PEFT.
    - Two related papers are listed with their authorship, venue and publication status.
  vi:
    - Đóng góp vào các thí nghiệm tiền huấn luyện ngôn ngữ có che và học đa nhiệm cho HMER.
    - Thử nghiệm mô hình thị giác–ngôn ngữ với Qwen2.5-VL và thích nghi tham số hiệu quả bằng LoRA/PEFT.
    - Hai công bố liên quan được ghi rõ tác giả, nơi công bố và trạng thái.
