title: NexOps
tagline:
  en: Smart MES / SCADA platform for connected manufacturing
  vi: Nền tảng MES / SCADA cho sản xuất kết nối
role:
  en: AI & Simulation Lead
  vi: Trưởng nhóm AI & Mô phỏng
period: 2025 – present
status:
  en: Prototype · in development
  vi: Nguyên mẫu · đang phát triển
summary:
  en:
    An MES/SCADA prototype that puts machine status, production plans, alarms and OEE in one place. The factory-wide demo
    runs on repeatable simulated scenarios; a separate control path has been tested with a real Bambu Lab printer over LAN.
  vi:
    Nguyên mẫu MES/SCADA gom trạng thái máy, kế hoạch sản xuất, cảnh báo và OEE vào một nơi. Phần demo toàn xưởng chạy bằng
    kịch bản mô phỏng có thể lặp lại; một luồng điều khiển riêng đã được thử với máy in Bambu Lab thật qua LAN.
highlights:
  en:
    - Local-first site architecture for telemetry, work orders, alarms and OEE reporting.
    - "Operational path: device or simulator → MQTT/EMQX → FastAPI/TimescaleDB → dashboard."
    - Real Bambu Lab LAN-control trial; the wider factory views use deterministic demo scenarios.
  vi:
    - Kiến trúc site local-first cho telemetry, lệnh sản xuất, cảnh báo và báo cáo OEE.
    - "Luồng vận hành: thiết bị hoặc simulator → MQTT/EMQX → FastAPI/TimescaleDB → dashboard."
    - Đã thử điều khiển Bambu Lab qua LAN thật; các màn hình nhà máy rộng hơn dùng kịch bản demo xác định.
