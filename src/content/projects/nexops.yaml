title: NexOps
tagline:
  en: Local-first MES / SCADA for factory operations
  vi: Nền tảng MES / SCADA local-first cho vận hành nhà máy
role:
  en: AI, Simulation & Platform Lead
  vi: Trưởng nhóm AI, Mô phỏng & Nền tảng
period: 2025 – present
status:
  en: Working prototype
  vi: Nguyên mẫu đang hoạt động
summary:
  en:
    NexOps gives production teams one local workspace for machine telemetry, plans, alarms and OEE. I lead the AI,
    simulation and platform work that turns repeatable factory scenarios into live operational views.
  vi: >-
    NexOps là nơi đội sản xuất theo dõi telemetry máy, kế hoạch, cảnh báo và OEE trong cùng một workspace cục bộ. Tôi phụ
    trách AI, mô phỏng và phần nền tảng: xây các kịch bản nhà máy có thể lặp lại rồi nối chúng vào những màn hình vận hành trực tiếp.
highlights:
  en:
    - Led the local runtime that connects telemetry, work orders, alarms and OEE across the operator views.
    - Built repeatable machine and shift simulations, plus the MQTT/EMQX path through FastAPI and TimescaleDB.
    - Integrated an edge control path for a Bambu Lab printer on the local network.
  vi:
    - Dẫn phần runtime cục bộ, nối telemetry, lệnh sản xuất, cảnh báo và OEE vào các màn hình vận hành.
    - Xây kịch bản máy và ca có thể chạy lại, cùng pipeline MQTT/EMQX đi qua FastAPI và TimescaleDB.
    - Tích hợp một luồng điều khiển edge cho Bambu Lab trong mạng cục bộ.
