title: LexiChem
tagline:
  en: Text-to-molecule web platform
  vi: Nền tảng web text-to-molecule
role:
  en: Contributor · Capstone project
  vi: Thành viên đóng góp · Đồ án tốt nghiệp
period: 2025 – 2026
status:
  en: Completed
  vi: Hoàn thành
summary:
  en:
    "LexiChem turns a written molecule description into candidate structures that can be checked and viewed in 2D or 3D.
    I worked on the AI data path, model experiments and the connection between inference and the application."
  vi:
    "LexiChem nhận mô tả phân tử bằng văn bản, sinh cấu trúc ứng viên rồi cho phép kiểm tra và xem ở dạng 2D hoặc 3D.
    Tôi phụ trách tuyến dữ liệu AI, thực nghiệm mô hình và phần nối suy luận với ứng dụng."
highlights:
  en:
    - 2D/3D molecule views with RDKit-backed structure checks and ADMET readouts.
    - Multiple generation models served through Triton Inference Server.
    - RAG/Knowledge is still under development; the remaining functions can be run in practice.
  vi:
    - Trực quan hóa phân tử 2D/3D, kiểm tra cấu trúc qua RDKit và hiển thị thuộc tính ADMET.
    - Phục vụ nhiều mô hình sinh qua Triton Inference Server.
    - RAG/Knowledge vẫn đang được phát triển; các chức năng còn lại có thể chạy thực tế.
